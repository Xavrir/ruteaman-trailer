<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=2340" />
    <title>RuteAman phone screen C, route options</title>
    <script src="../assets/vendor/gsap.min.js"></script>
    <script src="route.js"></script>
    <link rel="stylesheet" href="screen.css" />
    <style>
      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Medium.ttf") format("truetype"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Inter Display"; src: url("../assets/fonts/InterDisplay-SemiBold.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Inter Display"; src: url("../assets/fonts/InterDisplay-Bold.ttf") format("truetype"); font-weight: 700; }
      /* map-tall at 1x, the route centre (map-wide 1173,582) lands on screen (540,700) */
      #c-map { transform: translate(-633px, -502px); }
      #c-sheet { height: 1140px; }
      #c-title { position: absolute; left: 64px; top: 84px; font-family: "Inter Display", sans-serif; font-weight: 700; font-size: 76px; letter-spacing: -0.015em; }
      .opt {
        position: absolute; left: 40px; right: 40px; height: 270px; border-radius: 60px;
        display: flex; align-items: center; padding: 0 52px; gap: 52px;
      }
      .opt.sel { background: var(--elevated); }
      .opt.alt { border: 3px solid var(--separator); }
      .opt .risk { width: 170px; flex: none; }
      .opt .risk .v { display: block; font-family: "Inter Display", sans-serif; font-weight: 700; font-size: 116px; line-height: 1; letter-spacing: -0.02em; }
      .opt .risk .u { display: block; margin-top: 10px; font-size: 44px; font-weight: 500; color: var(--label2); }
      .opt .name { font-size: 64px; font-weight: 600; letter-spacing: -0.01em; }
      .opt .meta { margin-top: 12px; font-size: 54px; font-weight: 400; color: var(--label2); }
      #c-go {
        position: absolute; left: 40px; right: 40px; top: 836px; height: 160px; border-radius: 56px; background: var(--accent);
        display: grid; place-items: center; font-size: 64px; font-weight: 600; color: var(--on-accent);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="screen-c" data-start="0" data-duration="6.5" data-width="1080" data-height="2340">
      <div class="panel">
        <div class="map" id="c-map">
          <img src="img/map-tall.jpg" alt="" style="filter: grayscale(0.85) brightness(0.8) contrast(1.05)" />
          <svg id="c-svg" viewBox="0 0 1800 1800">
            <g transform="translate(0 620)">
              <path id="c-fast" fill="none" stroke="#636366" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
              <g id="c-rib"></g>
              <circle cx="1400" cy="305" r="20" fill="#000" stroke="#fff" stroke-width="9" />
              <g id="c-start"></g>
            </g>
          </svg>
        </div>
        <div class="topfade"></div>
        <div class="ctl" style="left: 48px; top: 200px">
          <svg class="ico" width="72" height="72" viewBox="0 0 24 24" style="stroke-width: 2.2"><path d="m14.5 5-7 7 7 7" /></svg>
        </div>
        <div class="sheet" id="c-sheet">
          <div class="grabber"></div>
          <div id="c-title">2 rute ditemukan</div>
          <div class="opt sel" style="top: 216px">
            <div class="risk"><span class="v num" style="color: var(--accent)">22</span><span class="u">Risiko</span></div>
            <div><div class="name">Rute Aman</div><div class="meta num">18 mnt · 1,4 km</div></div>
          </div>
          <div class="opt alt" style="top: 516px">
            <div class="risk"><span class="v num">68</span><span class="u">Risiko</span></div>
            <div><div class="name">Rute Tercepat</div><div class="meta num">13 mnt · 1,1 km</div></div>
          </div>
          <div id="c-go">Mulai</div>
          <div class="home-ind"></div>
        </div>
        <div class="status">
          <div class="time num">22.47</div>
          <div class="icons">
            <svg width="52" height="36" viewBox="0 0 26 18"><rect x="0" y="12" width="4.5" height="6" rx="1.2" /><rect x="7" y="8" width="4.5" height="10" rx="1.2" /><rect x="14" y="4" width="4.5" height="14" rx="1.2" /><rect x="21" y="0" width="4.5" height="18" rx="1.2" /></svg>
            <svg width="50" height="36" viewBox="0 0 25 18"><path d="M12.5 17.5 16 13.3a5.4 5.4 0 0 0-7 0z" /><path d="M5.2 9.7a11 11 0 0 1 14.6 0l-2.2 2.5a7.6 7.6 0 0 0-10.2 0z" /><path d="M1.5 5.6a16.6 16.6 0 0 1 22 0l-2.2 2.5a13.2 13.2 0 0 0-17.6 0z" /></svg>
            <svg width="76" height="36" viewBox="0 0 38 18"><rect x="0.8" y="0.8" width="32" height="16.4" rx="4.6" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.6" /><rect x="3.4" y="3.4" width="21" height="11.2" rx="2.6" /><path d="M35 6v6a2.6 2.6 0 0 0 0-6z" fill-opacity="0.45" /></svg>
          </div>
        </div>
        <div class="punch"></div>
      </div>
    </div>
    <script>
      document.getElementById("c-fast").setAttribute("d", RA.roundedPath(RA.FAST));
      RA.ribbon(document.getElementById("c-rib"), 26);
      RA.dot(document.getElementById("c-start"), RA.START[0], RA.START[1], 24, 60);
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 6.5 }, 0);
      window.__timelines["screen-c"] = tl;
    </script>
  </body>
</html>
